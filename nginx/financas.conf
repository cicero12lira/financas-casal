# nginx interno do container financas_frontend.
# Serve o SPA na raiz e faz proxy de /api → financas_backend (rede Docker interna).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API → backend FastAPI
    location /api/ {
        proxy_pass http://financas_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker / index não devem ser cacheados agressivamente
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js      { add_header Cache-Control "no-cache"; }
}
